# OPTIONAL: in-cluster MariaDB, for when a DBOD instance is not (yet) available.
# You are responsible for backups — prefer DBOD for production.
# Requires a secret with the database credentials:
#   oc create secret generic cima-mariadb \
#       --from-literal=MYSQL_USER=cima_app \
#       --from-literal=MYSQL_PASSWORD=<app password> \
#       --from-literal=MYSQL_ROOT_PASSWORD=<root password> \
#       --from-literal=MYSQL_DATABASE=cima
# and in cima-secrets use DB_HOST=cima-mariadb, DB_PORT=3306.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cima-mariadb
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cima-mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume cannot be mounted by two pods at once
  selector:
    matchLabels:
      app: cima-mariadb
  template:
    metadata:
      labels:
        app: cima-mariadb
    spec:
      containers:
        - name: mariadb
          # sclorg images run as an arbitrary UID under OKD's restricted SCC
          image: quay.io/sclorg/mariadb-1011-c9s:latest
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: cima-mariadb
          readinessProbe:
            tcpSocket:
              port: 3306
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cima-mariadb
---
apiVersion: v1
kind: Service
metadata:
  name: cima-mariadb
spec:
  selector:
    app: cima-mariadb
  ports:
    - port: 3306
      targetPort: 3306
