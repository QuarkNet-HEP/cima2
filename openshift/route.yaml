# The CERN router terminates TLS with a CERN-issued certificate.
# Set host to the site name you want (e.g. cima2.web.cern.ch), or delete the
# host line to get the default <route>-<project>.app.cern.ch hostname.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cima
  annotations:
    # Default visibility on CERN PaaS is Intranet (CERN network only).
    # Masterclass students connect from their schools, so expose to the Internet.
    router.cern.ch/network-visibility: Internet
    # The platform adds a CERN-only IP allowlist to new routes; an empty value
    # lifts it (removing the annotation doesn't, as it is re-added).
    haproxy.router.openshift.io/ip_whitelist: ""
spec:
  host: cima2.web.cern.ch
  to:
    kind: Service
    name: cima
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
